name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit (latest stable, >= 1.0.0-rc1)
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain version
        run: |
          moon --version
          moonc -v

      - name: Check formatting
        run: moon fmt --check

      - name: Check
        run: moon check --deny-warn

      - name: Build
        run: moon build

      - name: Test
        run: moon test

      - name: Run example
        run: moon run cmd -- demo
